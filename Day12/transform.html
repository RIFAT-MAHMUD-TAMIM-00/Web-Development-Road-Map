<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .container, .inner{
            width: 200px;
            height: 200px;
        }
        .container{
            border: 2px solid red;
            background-color: lightblue;
            
        }
        .inner{
            border: 2px solid blue;
            background-color: lightgreen;
            /* display: none; */
            /* transform: scale(0.5); */
            /* transform: scale(0.5, 0.3); */
            /* transform: rotate(45deg); */
            transform: scale(0.5) rotate(45deg) translate(100px, -400px);
            
        }
        .inner:hover{
            transform: rotate(25deg);
        }

    </style>
</head>
<body>
    <h2>
        Explore Transform and Translate properties in CSS 
    </h2>
    <div class="container">container-1
        <div class="inner">Inner-1</div>
    </div>
    <div class="container">container-2
        <div class="inner">Inner-2</div>
    </div>
    <div class="container">container-3
        <div class="inner">Inner-3</div>
    </div>
    
</body>
</html>
