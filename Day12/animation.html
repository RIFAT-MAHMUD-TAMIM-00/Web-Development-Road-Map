<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore animation</title>
    <style>
        @keyframes ping-pong{
            from{
                left:0px;
                
            }
            to{
                left:450px;
                background-color: green;
                
            }
        }
        @keyframes bounce{
            0%{
                top:0px;
                left: 0px;
            }
            25%{
                left:150px;
                top:200px;
            }
            50%{
                top:0px;
                left:300px;
            }
            100%{
                top:200px;
                left:450px;
            }
        }
        .stage{
            width:500px;
            height:300px;
            border:2px solid steelblue;
            background-color: lightblue;

        }
        .ball{
            width:50px;
            height:50px;
            background-color: red;
            border-radius: 50%;
            position: relative;
            /* animation: ping-pong 2s ease-in-out 1s 3 alternate; */
            animation :bounce 2s ease-in-out 1s infinite alternate;
        }
    </style>

</head>
<body>
    <h2>Explore Animation</h2>
    <div class="stage">
        <div class="ball"></div>

    </div>
    
</body>
</html>
